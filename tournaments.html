<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Tournaments - CS2 Club</title>

	<!-- Bootstrap 5 CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Custom Styles -->
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="footstyle.css">
	<!-- Google Fonts -->
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
	<!-- jQuery -->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<!-- Bootstrap 5 JS Bundle -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

	<style>
		/* Hero Section */
		.tournament-hero {
			height: 50vh;
			background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('image/teamstop.gif');
			background-size: cover;
			background-position: center;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			padding: 0 20px;
		}
		.tournament-hero h1 {
			font-size: 3.8rem;
			color: #FFD700;
			text-shadow: 0 0 30px rgba(255,215,0,0.3);
		}
		.tournament-hero p {
			font-size: 1.2rem;
			color: #CCD6F6;
			max-width: 600px;
		}

		/* Filter Buttons */
		.filter-section {
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
			margin: 30px auto 20px;
			padding: 20px;
			background: #0b1727;
			border-radius: 18px;
			width: 85%;
			max-width: 800px;
			border: 1px solid rgba(255,215,0,0.15);
			justify-content: center;
		}
		.filter-btn {
			padding: 10px 28px;
			border: 2px solid rgba(255,215,0,0.3);
			border-radius: 30px;
			background: transparent;
			color: #CCD6F6;
			font-family: 'Poppins', sans-serif;
			font-weight: 500;
			cursor: pointer;
			transition: 0.3s;
		}
		.filter-btn:hover {
			border-color: #FFD700;
			color: #FFD700;
		}
		.filter-btn.active {
			background: #FFD700;
			color: #041c41;
			border-color: #FFD700;
			font-weight: bold;
		}

		/* Tournament Cards */
		.tournament-card {
			background: #0b1727;
			border-radius: 18px;
			padding: 25px;
			border: 1px solid rgba(255,215,0,0.1);
			transition: 0.3s;
			height: 100%;
		}
		.tournament-card:hover {
			border-color: #FFD700;
			transform: translateY(-6px);
			box-shadow: 0 15px 40px rgba(255,215,0,0.08);
		}
		.tournament-card h3 {
			color: #FFD700;
			font-size: 1.4rem;
			margin: 8px 0 5px;
		}
		.tournament-card .event-name {
			color: #8892B0;
			font-size: 0.9rem;
		}
		.tournament-card .date-info {
			color: #CCD6F6;
			font-size: 0.9rem;
			margin: 8px 0;
		}
		.tournament-card .prize-pool {
			color: #4ade80;
			font-weight: bold;
		}
		.tournament-card .teams-preview {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-top: 15px;
			padding-top: 15px;
			border-top: 1px solid rgba(255,215,0,0.1);
		}
		.tournament-card .teams-preview .team-names {
			color: #CCD6F6;
			font-size: 0.95rem;
		}
		.tournament-card .teams-preview .vs {
			color: #FFD700;
			font-weight: bold;
			padding: 0 10px;
		}

		/* Status Badges */
		.status-badge {
			display: inline-block;
			padding: 4px 16px;
			border-radius: 20px;
			font-size: 0.75rem;
			font-weight: bold;
			margin-bottom: 12px;
		}
		.status-live {
			background: #ff4444;
			color: white;
			animation: pulse-live 1.5s infinite;
		}
		.status-upcoming {
			background: #f0a500;
			color: #041c41;
		}
		.status-finished {
			background: #2d6a4f;
			color: white;
		}
		@keyframes pulse-live {
			0% { opacity: 1; }
			50% { opacity: 0.5; }
			100% { opacity: 1; }
		}

		/* View Details Button */
		.view-details {
			color: #FFD700;
			font-size: 0.85rem;
			margin-top: 12px;
			display: inline-block;
			border: 1px solid rgba(255,215,0,0.2);
			padding: 6px 18px;
			border-radius: 20px;
			transition: 0.3s;
			background: transparent;
			cursor: pointer;
			font-family: 'Poppins', sans-serif;
		}
		.view-details:hover {
			background: #FFD700;
			color: #041c41;
		}

		/* Empty / Loading States */
		.empty-message {
			color: #8892B0;
			text-align: center;
			padding: 60px 20px;
			font-size: 1.2rem;
		}
		.loading-message {
			color: #CCD6F6;
			text-align: center;
			padding: 80px 20px;
			font-size: 1.3rem;
		}
		.loading-message .spinner {
			display: inline-block;
			width: 40px;
			height: 40px;
			border: 4px solid rgba(255,215,0,0.2);
			border-top: 4px solid #FFD700;
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
			margin-bottom: 15px;
		}
		@keyframes spin {
			to { transform: rotate(360deg); }
		}

		/* Modal */
		.modal-overlay {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			background: rgba(0,0,0,0.8);
			backdrop-filter: blur(6px);
			z-index: 9999;
			justify-content: center;
			align-items: center;
		}
		.modal-overlay.show {
			display: flex;
		}
		.modal-box {
			background: #0b1727;
			border: 2px solid #FFD700;
			border-radius: 20px;
			padding: 35px 40px 30px;
			max-width: 520px;
			width: 92%;
			max-height: 85vh;
			overflow-y: auto;
			position: relative;
			color: #CCD6F6;
			box-shadow: 0 25px 60px rgba(255,215,0,0.15);
			animation: scaleIn 0.3s ease;
		}
		@keyframes scaleIn {
			from { transform: scale(0.85); opacity: 0; }
			to { transform: scale(1); opacity: 1; }
		}
		.modal-box::-webkit-scrollbar { width: 6px; }
		.modal-box::-webkit-scrollbar-track { background: #041c41; border-radius: 10px; }
		.modal-box::-webkit-scrollbar-thumb { background: #FFD700; border-radius: 10px; }

		.modal-box .modal-close {
			position: absolute;
			top: 12px;
			right: 18px;
			font-size: 2.2rem;
			color: #FFD700;
			cursor: pointer;
			background: none;
			border: none;
			transition: 0.3s;
		}
		.modal-box .modal-close:hover {
			color: #ff4444;
			transform: rotate(90deg);
		}
		.modal-box .modal-title {
			color: #FFD700;
			font-size: 1.6rem;
			margin: 0 0 18px 0;
			padding-right: 30px;
			border-bottom: 2px solid rgba(255,215,0,0.2);
			padding-bottom: 12px;
		}
		.modal-box .modal-body {
			font-size: 0.95rem;
			line-height: 1.8;
		}
		.modal-box .modal-body .detail-row {
			display: flex;
			justify-content: space-between;
			padding: 6px 0;
			border-bottom: 1px solid rgba(255,215,0,0.06);
		}
		.modal-box .modal-body .detail-row .label {
			color: #8892B0;
		}
		.modal-box .modal-body .detail-row .value {
			color: #CCD6F6;
			font-weight: 500;
			text-align: right;
			max-width: 60%;
		}
		.modal-box .modal-body .detail-row .value.highlight {
			color: #FFD700;
		}
		.modal-box .modal-body .teams-list {
			display: flex;
			flex-wrap: wrap;
			gap: 6px 12px;
			justify-content: flex-end;
		}
		.modal-box .modal-body .teams-list span {
			background: #041c41;
			padding: 2px 12px;
			border-radius: 12px;
			font-size: 0.85rem;
			border: 1px solid rgba(255,215,0,0.1);
		}
		.modal-box .modal-footer {
			margin-top: 18px;
			padding-top: 15px;
			border-top: 1px solid rgba(255,215,0,0.15);
			text-align: center;
		}
		.modal-box .modal-footer .close-btn {
			background: #FFD700;
			color: #041c41;
			border: none;
			padding: 10px 40px;
			border-radius: 30px;
			font-family: 'Poppins', sans-serif;
			font-weight: bold;
			font-size: 1rem;
			cursor: pointer;
			transition: 0.3s;
		}
		.modal-box .modal-footer .close-btn:hover {
			background: #f0a500;
			transform: scale(1.03);
			box-shadow: 0 0 25px rgba(255,215,0,0.3);
		}

		/* Responsive */
		@media screen and (max-width: 768px) {
			.tournament-hero h1 { font-size: 2.5rem; }
			.filter-section { width: 95%; gap: 8px; }
			.filter-btn { padding: 8px 16px; font-size: 0.85rem; }
			.modal-box { padding: 25px 20px; width: 95%; }
			.modal-box .modal-title { font-size: 1.3rem; }
			.modal-box .modal-body .detail-row {
				flex-direction: column;
				align-items: flex-start;
				gap: 2px;
			}
			.modal-box .modal-body .detail-row .value {
				text-align: left;
				max-width: 100%;
			}
			.modal-box .modal-body .teams-list {
				justify-content: flex-start;
			}
		}
	</style>
</head>
<body>

	<!-- Navbar -->
	<div id="navbar"></div>

	<!-- Hero -->
	<section class="tournament-hero">
		<h1>🏆 Tournaments</h1>
		<p>Track upcoming, live, and completed CS2 tournaments from around the globe.</p>
	</section>

	<!-- Filter Buttons -->
	<div class="filter-section">
		<button class="filter-btn active" data-filter="all">📋 All</button>
		<button class="filter-btn" data-filter="live">🔴 Live</button>
		<button class="filter-btn" data-filter="upcoming">📅 Upcoming</button>
		<button class="filter-btn" data-filter="finished">✅ Finished</button>
	</div>

	<!-- Tournament Grid (Bootstrap) -->
	<div class="container mt-4">
		<div class="row" id="tournament-grid">
			<div class="col-12 text-center py-5">
				<div class="spinner-border text-warning" role="status">
					<span class="visually-hidden">Loading...</span>
				</div>
				<p class="text-light mt-3">Loading tournaments...</p>
			</div>
		</div>
	</div>

	<!-- Modal -->
	<div class="modal-overlay" id="modal-overlay">
		<div class="modal-box">
			<button class="modal-close" id="modal-close">&times;</button>
			<h2 class="modal-title" id="modal-title">Tournament Name</h2>
			<div class="modal-body" id="modal-body"></div>
			<div class="modal-footer">
				<button class="close-btn" id="modal-close-btn">Close</button>
			</div>
		</div>
	</div>

	<!-- Footer -->
	<div id="footer"></div>

	<script>
		const $id = id => document.getElementById(id);
		const qs = (sel, ctx = document) => ctx.querySelector(sel);

	
		const statusMap = {
			live: '<span class="status-badge status-live">🔴 LIVE</span>',
			upcoming: '<span class="status-badge status-upcoming">📅 Upcoming</span>',
			finished: '<span class="status-badge status-finished">✅ Finished</span>'
		};

		let tournaments = [];
		let currentFilter = 'all';


		Promise.all([
			fetch('navbar.html').then(r => r.text()),
			fetch('footer.html').then(r => r.text())
		]).then(([nav, foot]) => {
			$id('navbar').innerHTML = nav;
			$id('footer').innerHTML = foot;

			const menuToggle = $id('menu-toggle');
			const navmenu = $id('menu');
			const closeBtn = $id('close-button');
			const overlay = $id('overlay');

			const toggle = () => {
				navmenu.classList.toggle('active');
				overlay.classList.toggle('active');
			};
			menuToggle?.addEventListener('click', toggle);
			closeBtn?.addEventListener('click', toggle);
			overlay?.addEventListener('click', toggle);
		}).catch(() => console.warn('Nav/Footer load failed'));

	
		$.getJSON('tournaments.json')
			.done(function(data) {
				tournaments = data;
				const saved = sessionStorage.getItem('tournamentFilter');
				if (saved) {
					$('.filter-btn').removeClass('active');
					$(`.filter-btn[data-filter="${saved}"]`).addClass('active');
					currentFilter = saved;
				}
				render(currentFilter);
			})
			.fail(function() {
				$('#tournament-grid').html(`
					<div class="col-12">
						<div class="empty-message" style="color:#ff6b6b;">
							⚠️ Failed to load tournament data.<br>
							<small style="color:#8892B0;">Make sure tournaments.json exists.</small>
						</div>
					</div>
				`);
			});

		//render tournament cards
		function render(filter) {
			const data = filter === 'all'
				? tournaments
				: tournaments.filter(t => t.status === filter);

			if (!tournaments.length) {
				$('#tournament-grid').html(`
					<div class="col-12">
						<div class="loading-message">
							<div class="spinner"></div>
							<p>Loading tournaments...</p>
						</div>
					</div>
				`);
				return;
			}

			if (!data.length) {
				$('#tournament-grid').html(`
					<div class="col-12">
						<div class="empty-message">😅 No ${filter} tournaments found.</div>
					</div>
				`);
				return;
			}

			let html = '';
			$.each(data, function(i, t) {
				html += `
					<div class="col-lg-4 col-md-6 col-sm-12 mb-4">
						<div class="tournament-card h-100">
							${statusMap[t.status] || ''}
							<h3>${t.name}</h3>
							<div class="event-name">📌 ${t.event}</div>
							<div class="date-info">📅 ${t.date}</div>
							<div class="prize-pool">💰 ${t.prize}</div>
							<div class="teams-preview">
								<span class="team-names">${t.teams.slice(0,3).join(' · ')}${t.teams.length>3?' …':''}</span>
								<span class="vs">⚔️</span>
							</div>
							<div style="font-size:0.8rem;color:#8892B0;margin-top:5px;">🏅 Top Match: ${t.topMatch}</div>
							<button class="view-details" data-id="${t.id}">🔍 View Details</button>
						</div>
					</div>
				`;
			});

			$('#tournament-grid').html(html);

			// Bind detail button events
			$('.view-details').on('click', function() {
				openModal($(this).data('id'));
			});

			sessionStorage.setItem('tournamentFilter', filter);
		}

		//Filter buttons
		$('.filter-btn').on('click', function() {
			$('.filter-btn').removeClass('active');
			$(this).addClass('active');
			currentFilter = $(this).data('filter');
			render(currentFilter);
		});

		//Modal functions
		function openModal(id) {
			const t = tournaments.find(x => x.id === id);
			if (!t) return;

			$('#modal-title').text(t.name);
			$('#modal-body').html(`
				${['Event','Date','Prize Pool','Status','Top Match'].map((label,i) => `
					<div class="detail-row">
						<span class="label">${['📌','📅','💰','📊','🏅'][i]} ${label}</span>
						<span class="value${i===2?' highlight':''}">${i===3?statusMap[t.status]||t.status:i===4?t.topMatch:[t.event,t.date,t.prize][i]}</span>
					</div>
				`).join('')}
				<div class="detail-row">
					<span class="label">👥 Teams</span>
					<span class="value teams-list">${t.teams.map(x=>`<span>${x}</span>`).join('')}</span>
				</div>
				<div style="text-align:center;color:#8892B0;font-size:0.85rem;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,215,0,0.08);">
					📺 Check back for match VODs and live streams!
				</div>
			`);

			$('#modal-overlay').addClass('show');
			$('body').css('overflow', 'hidden');

			// Track viewed tournaments
			const viewed = JSON.parse(sessionStorage.getItem('viewedTournaments') || '[]');
			if (!viewed.includes(id)) {
				viewed.push(id);
				sessionStorage.setItem('viewedTournaments', JSON.stringify(viewed));
			}
		}

		function closeModal() {
			$('#modal-overlay').removeClass('show');
			$('body').css('overflow', 'auto');
		}

		// Modal close bindings
		$('#modal-close, #modal-close-btn').on('click', closeModal);
		$('#modal-overlay').on('click', function(e) {
			if (e.target === this) closeModal();
		});
		$(document).on('keydown', function(e) {
			if (e.key === 'Escape' && $('#modal-overlay').hasClass('show')) closeModal();
		});
	</script>

</body>
</html>
